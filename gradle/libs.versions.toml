[versions]
coroutines-version = "1.11.0"
detekt-version = "1.23.8"
dokka-version = "2.3.0"
kotlin-version = "2.4.21"
kover-version = "0.9.11"
spotless-changelog-version = "3.1.2"
spotless-version = "8.11.0"
tapmoc-version = "0.5.0"
versions-version = "0.67.0"

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt-version" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka-version" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin-version" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover-version" }
maven-publish = { id = "maven-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-version" }
spotless-changelog = { id = "com.diffplug.spotless-changelog", version.ref = "spotless-changelog-version" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc-version" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-version" }

[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines-version" }
